<div id="shells-container" class="overflow-auto h-100 px-2">
    <fhg-aas-table
        [documents]="documents()"
        [selected]="selected()"
        (selectedChange)="setSelected($event)"
        [expression]="filter()"
    ></fhg-aas-table>
</div>

<ng-template #toolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-outline-primary" type="button" (click)="addToFavorites().subscribe()">
            <i class="bi bi-star"></i>
        </button>
        <select
            [ngClass]="activeFavoritesList() ? 'form-select fst-normal fw-normal' : 'form-select fst-italic fw-light'"
            [ngModel]="activeFavoritesList()"
            (ngModelChange)="setActiveFavoriteList($event)"
        >
            @for (option of favoritesLists(); track option; let i = $index) {
                @if (i === 0) {
                    <option class="fst-italic fw-light" [value]="''" translate>Shells.FAVORITES</option>
                } @else {
                    <option class="fst-normal fw-normal" [value]="option">{{ option }}</option>
                }
            }
        </select>
        <button
            class="btn btn-outline-primary"
            type="button"
            (click)="addToStart().subscribe()"
            [disabled]="someSelected() === false"
        >
            <i class="bi bi-house-add"></i>
        </button>
    </div>
    @if (!activeFavoritesList()) {
        <div class="input-group me-2 my-1">
            <button type="button" class="btn btn-primary" (click)="getFirstPage()">
                <i class="bi bi-chevron-bar-left"></i>
            </button>
            <button type="button" class="btn btn-primary" (click)="getPreviousPage()" [disabled]="isFirstPage()">
                <i class="bi bi-chevron-left"></i>
            </button>
            <select class="form-select" [ngModel]="limit()" (ngModelChange)="setLimit($event)">
                <option [ngValue]="10">10</option>
                <option [ngValue]="20">20</option>
                <option [ngValue]="30">30</option>
                <option [ngValue]="40">40</option>
                <option [ngValue]="50">50</option>
            </select>
            <button type="button" class="btn btn-primary" (click)="getNextPage()" [disabled]="isLastPage()">
                <i class="bi bi-chevron-right"></i>
            </button>
            <button type="button" class="btn btn-primary" (click)="getLastPage()">
                <i class="bi bi-chevron-bar-right"></i>
            </button>
        </div>
    }
    <div class="btn-group me-2 my-1">
        <div ngbDropdown class="btn-group" role="group">
            <button type="button" class="btn btn-primary" ngbDropdownToggle id="menuEndpoints" translate>
                Shells.ENDPOINT
            </button>
            <div ngbDropdownMenu class="dropdown-menu" id="menuEndpoints">
                <button ngbDropdownItem (click)="addEndpoint().subscribe()" translate>Shells.ADD_ENDPOINT</button>
                <button ngbDropdownItem (click)="updateEndpoint().subscribe()" translate>Shells.UPDATE_ENDPOINT</button>
                <button ngbDropdownItem (click)="removeEndpoint().subscribe()" translate>Shells.REMOVE_ENDPOINT</button>
                <button ngbDropdownItem (click)="extras().subscribe()" translate>Shells.EXTRAS</button>
            </div>
        </div>
    </div>
    <div class="btn-group me-2 my-1">
        <button class="btn btn-primary ms-2" type="button" id="AID_OPEN_FILE" (click)="inputFiles.click()">
            <i class="bi bi-upload"></i>
        </button>
        <input
            #inputFiles
            class="form-control"
            type="file"
            id="AID_INPUT_FILE"
            accept=".aasx"
            [multiple]="true"
            [(ngModel)]="files"
            hidden
        />
        <button
            type="button"
            class="btn btn-primary"
            (click)="downloadPackages().subscribe()"
            [disabled]="someSelected() === false"
        >
            <i class="bi bi-download"></i>
        </button>
        <button
            type="button"
            class="btn btn-primary"
            (click)="deletePackages().subscribe()"
            [disabled]="someSelected() === false"
        >
            <i class="bi bi-trash"></i>
        </button>
    </div>
    <div class="btn-group me-2 my-1">
        <div ngbDropdown class="btn-group" role="group">
            <button type="button" class="btn btn-primary" ngbDropdownToggle id="selectEndpoints" translate>
                LABEL_VIEWS
            </button>
            <div ngbDropdownMenu class="dropdown-menu" id="selectEndpoints">
                @for (view of views(); track view.path) {
                    <button ngbDropdownItem (click)="openView(view)" [disabled]="someSelected() === false">
                        {{ 'Shells.' + view.path | translate }}
                    </button>
                }
            </div>
        </div>
    </div>
    <div class="input-group flex-grow-1 me-2 my-1">
        <div class="input-group-text">
            <i class="bi bi-filter"></i>
        </div>
        <input
            #textInput
            type="search"
            class="form-control"
            [placeholder]="'Shells.PLACEHOLDER_FILTER' | translate"
            [ngModel]="filterText()"
            (ngModelChange)="setFilterText($event)"
            [ngModelOptions]="{ updateOn: 'blur' }"
            (keydown.enter)="textInput.blur()"
            (search)="setFilterText('')"
        />
    </div>
</ng-template>
