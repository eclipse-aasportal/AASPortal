<div id="start-page" class="overflow-auto h-100 px-2">
    @if (isEmpty()){
    <div id="AID_MD_CONTENT" [innerHTML]="welcome()"></div>
    } @else {
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4">
        @for (item of items(); track item; let i = $index) {
        <div class="p-2 rounded col" [class.bg-info-subtle]="item.selected()" style="min-width: 380px;">
            <div class="card" (click)="toggleSelected($event, item)" tabindex="0">
                <ng-container [ngComponentOutlet]="item.component"
                    [ngComponentOutletInputs]="item.inputs"></ng-container>
            </div>
        </div>
        }
    </div>
    }
</div>

<ng-template #startToolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-primary" type="button" (click)="remove().subscribe()" [disabled]="!hasSelected()">
            <i class="bi bi-trash"></i>
        </button>
        <button class="btn btn-primary" type="button" (click)="moveLeft().subscribe()" [disabled]="!canMoveLeft()">
            <i class="bi bi-arrow-left"></i>
        </button>
        <button class="btn btn-primary" type="button" (click)="moveRight().subscribe()" [disabled]="!canMoveRight()">
            <i class="bi bi-arrow-right"></i>
        </button>
   </div>
</ng-template>
