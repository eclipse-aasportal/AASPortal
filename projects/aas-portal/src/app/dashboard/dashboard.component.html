<div id="fhg-dashboard-container" class="overflow-y-auto overflow-x-hidden container-fluid h-100 w-100">
    @if (!isEmpty()) {
    @if (firstItems().length > 0) {
    <div class="row">
        @for (item of firstItems(); track item) {
        <div class="col" (click)="toggleSelection($event, item)" (keydown.enter)="toggleSelection($event, item)"
            tabindex="-1">
            <div class="h-auto my-1 w-auto border border-2 rounded" [class.border-info]="item.selected()">
                @if (!editMode()) {
                <canvas #chart [id]="item.id"></canvas>
                }
                @else {
                <fhg-chart-edit [item]="item"></fhg-chart-edit>
                }
            </div>
        </div>
        }
    </div>
    }
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4">
        @for (item of items(); track item) {
        <div class="col" (click)="toggleSelection($event, item)" (keydown.enter)="toggleSelection($event, item)"
            tabindex="-1">
            <div class="mx-auto my-1 h-auto w-auto border border-2 rounded" [class.border-info]="item.selected()">
                @if (!editMode()) {
                <canvas #chart [id]="item.id"></canvas>
                }
                @else {
                <fhg-chart-edit [item]="item"></fhg-chart-edit>
                }
            </div>
        </div>
        }
    </div>
    } @else {
    <div class="alert alert-info text-center mt-2" role="alert">{{'Dashboard.EMPTY' | translate}}</div>
    }
</div>

<ng-template #dashboardToolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-primary" type="button" (click)="addToStart().subscribe()">
            <i class="bi bi-house-add"></i>
        </button>
    </div>
    <div class="input-group me-2 my-1">
        <select #select class="form-select" [ngModel]="activePage()" (ngModelChange)="setActivePage($event)">
            @for (page of pages(); track page) {
            <option [ngValue]="page">{{page.name}}</option>
            }
        </select>
        <button type="button" class="btn btn-primary" (click)="addNew()" [disabled]="!editMode()">
            <i class="bi bi-plus"></i>
        </button>
        <button type="button" class="btn btn-primary" (click)="rename()" [disabled]="!editMode()">
            <i class="bi bi-pen"></i>
        </button>
        <button type="button" class="btn btn-primary" (click)="delete()" [disabled]="!editMode()">
            <i class="bi bi-trash"></i>
        </button>
    </div>
    <div class="input-group me-2 my-1">
        <div class="form-check form-switch pt-2">
            <input class="form-check-input" type="checkbox" role="switch" id="toggleEditMode" [(ngModel)]="editMode">
            <label class="form-check-label" for="toggleEditMode" translate="Dashboard.LABEL_EDIT_MODE"></label>
        </div>
    </div>
    <div class="btn-group me-2 my-1" [hidden]="!editMode()">
        <button type="button" class="btn btn-primary" (click)="undo()" [disabled]="!canUndo()">
            <i class="bi bi-arrow-counterclockwise"></i>
        </button>
        <button type="button" class="btn btn-primary" (click)="redo()" [disabled]="!canRedo()">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </div>
    <div class="btn-group me-2 my-1" [hidden]="!editMode()">
        <button type="button" class="btn btn-primary" (click)="movePrevious()" [disabled]="!canMovePrevious()">
            <i class="bi bi-box-arrow-left"></i>
       </button>
        <button type="button" class="btn btn-primary" (click)="moveNext()" [disabled]="!canMoveNext()">
            <i class="bi bi-box-arrow-right"></i>
         </button>
    </div>
</ng-template>
