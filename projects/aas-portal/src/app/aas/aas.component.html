<div class="container h-100 w-100 px-2" style="overflow-y:auto">

    <!-- Header of AAS View -->
    @if (document()) {
        <div class="fhg-aas-header">
            <div class="d-flex flex-row flex-wrap align-items-center justify-content-around">
                <!-- Header of the header -->
                <div class="container h-100 align-self-start text-white">
                    <div class="d-flex flex-column text-center">
                        <div class="bg-primary text-center py-2 my-2 fs-5">
                            <div class="d-flex flex-column data-entry">
                                <label style="font-size: 15px;">AAS Overview</label>
                                <label style="font-size: 20px;">{{idShort()}}</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex-fill d-flex flex-row flex-wrap align-items-center justify-content-center">
                    <div class="border border-secondary rounded p-1">
                        <img
                            class="img-fluid"
                            [src]="thumbnail()"
                            alt="thumbnail"
                            (error)="thumbnail.set('/assets/resources/aas-idta.png')"
                            style="max-height: 180px;"
                        />
                    </div>
                    <div class="d-flex flex-column ps-1">
                        <div class="col-md-6 p-1 d-flex flex-column mt-0">
                            <label class="label" translate>LABEL_VERSION</label>
                            <label class="ms-2">{{version()}}</label>
                        </div>
                        <div class="col-md-6 p-1 d-flex flex-column mt-0">
                            <label class="label" translate>LABEL_AAS_ID</label>
                            <label class="ms-2">{{id()}}</label>
                        </div>
                        <div class="col-md-6 p-1 d-flex flex-column mt-0">
                            <label class="label" translate>LABEL_ASSET_ID</label>
                            <label class="ms-2">{{assetId()}}</label>
                        </div>
                    </div>
                </div>

                <div class="">
                    <div class="d-flex flex-column mt-1 mx-4">
                        <label class="label">AAS Content<br>View</label>
                        <button [routerLink]="openShellView()" type="button" class="btn btn-primary" style="font-size: 1.5rem; width: min-content"><i class="bi bi-box-arrow-up-right"></i></button>
                    </div>
                    <div class="d-flex flex-column mt-1 mx-4">
                        <label class="label">AAS Browser</label>
                        <button [routerLink]="openBrowserView()" type="button" class="btn btn-primary" style="font-size: 1.5rem; width: min-content"><i class="bi bi-box-arrow-up-right"></i></button>
                    </div>
                </div>
            </div>
        </div>
    }

    <!-- Body of AAS View -->
    <div class="fhg-aas-document">
          <!-- Tab headers -->
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
            <button class="nav-link active" id="submodels-tab" data-bs-toggle="tab" data-bs-target="#submodels"
                    type="button" role="tab" aria-controls="submodels" aria-selected="true">
                Submodels
            </button>
            </li>
            <li class="nav-item" role="presentation">
            <button class="nav-link" id="tree-tab" data-bs-toggle="tab" data-bs-target="#tree"
                    type="button" role="tab" aria-controls="tree" aria-selected="false">
                AAS Tree
            </button>
            </li>
        </ul>

          <!-- Tab content -->
        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="submodels" role="tabpanel" aria-labelledby="submodels-tab">
                <div class="d-flex flex-row flex-wrap">
                    @for (submodel of getSubmodels(); track submodel) {
                        <div class="d-flex flex-row mx-2 my-1 py-2 px-3 border border-1 border-black rounded-3 align-items-center bg-primary-subtle">
                            <div class="me-4 text-secondary" style="font-size: 3.5rem;">
                                <i class="bi" [ngClass]="getSubmodelIcon(submodel)"></i>
                            </div>
                            <div class="me-4">
                                <label  style="font-size:14px; overflow-wrap: anywhere; word-break: break-word;">{{getSubmodelSemanticId(submodel)}}</label>
                                <h4 style="overflow-wrap: anywhere; word-break: break-word;">{{submodel.idShort}}</h4>
                            </div>
                            <div>
                                <button [routerLink]="openSubmodelView(submodel)" type="button" class="btn btn-primary" style="font-size: 1.5rem;"><i class="bi bi-box-arrow-up-right"></i></button>
                            </div>
                        </div>
                    }
                </div>
            </div>

            <div class="tab-pane fade" id="tree" role="tabpanel" aria-labelledby="tree-tab">
               <fhg-aas-tree
                    #aasTree
                    [live]="live()"
                    [searchExpression]="searchExpression()"
                    [document]="document()"
                    (selected)="setSelectedElements($event)"
                    [state]="treeState"
                >
                </fhg-aas-tree>
            </div>
        </div>
    </div>


</div>

<!-- Toolbar -->
<ng-template #toolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-primary" type="button" (click)="addToStart().subscribe()">
            <i class="bi bi-house-add"></i>
        </button>
    </div>
    <div class="btn-group me-2 my-1">
        <button type="button" class="btn btn-primary" (click)="play()" [disabled]="canPlay() === false">
            <i class="bi bi-play-fill"></i>
        </button>
        <button type="button" class="btn btn-primary" (click)="stop()" [disabled]="canStop() === false">
            <i class="bi bi-stop-fill"></i>
        </button>
    </div>
    <div class="input-group me-2 my-1">
        <select class="form-select" [ngModel]="dashboardPage()" (ngModelChange)="setDashboardPage($event)">
            @for (page of dashboardPages(); track page) {
                <option [ngValue]="page">{{ page.name }}</option>
            }
        </select>
        <button
            type="button"
            class="btn btn-primary"
            (click)="addToDashboard('Line')"
            [disabled]="!canAddToDashboard()"
        >
            <i class="bi bi-graph-up"></i>
        </button>
        <button
            type="button"
            class="btn btn-primary"
            (click)="addToDashboard('BarVertical')"
            [disabled]="!canAddToDashboard()"
        >
            <i class="bi bi-bar-chart-line-fill"></i>
        </button>
    </div>
    <div class="btn-group me-2 my-1" [hidden]="readOnly()">
        <button
            type="button"
            class="btn btn-primary"
            (click)="synchronize().subscribe()"
            [disabled]="canSynchronize() === false"
        >
            <i class="bi bi-arrow-repeat"></i>
        </button>
    </div>
    <div class="btn-group me-2 my-1">
        <button type="button" class="btn btn-primary" (click)="download()">
            <i class="bi bi-download"></i>
        </button>
    </div>
    <div class="btn-group me-2 my-1" [hidden]="readOnly()">
        <button type="button" class="btn btn-primary" (click)="undo()" [disabled]="canUndo() === false">
            <i class="bi bi-arrow-counterclockwise"></i>
        </button>
        <button type="button" class="btn btn-primary" (click)="redo()" [disabled]="canRedo() === false">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </div>
    <div class="btn-group me-2 my-1" [hidden]="readOnly()">
        <button type="button" class="btn btn-primary" (click)="newElement().subscribe()" [disabled]="!canNewElement()">
            <i class="bi bi-plus-lg"></i>
        </button>
        <button
            type="button"
            class="btn btn-primary"
            (click)="editElement().subscribe()"
            [disabled]="!canEditElement()"
        >
            <i class="bi bi-pencil"></i>
        </button>
        <button
            type="button"
            class="btn btn-primary"
            (click)="deleteElement().subscribe()"
            [disabled]="!canDeleteElement()"
        >
            <i class="bi bi-trash"></i>
        </button>
    </div>
    <div class="input-group flex-grow-1 me-2 my-1">
        <div class="input-group-text"><i class="bi bi-search"></i></div>
        <input
            type="text"
            class="form-control"
            [ngModel]="searchExpression()"
            (ngModelChange)="setSearchExpression($event)"
            [placeholder]="'AAS.PLACEHOLDER_SEARCH' | translate"
        />
        <!-- <button type="button" class="btn btn-primary" (click)="aasTree.findNext()">
            <i class="bi bi-chevron-down"></i>
        </button>
        <button type="button" class="btn btn-primary" (click)="aasTree.findPrevious()">
            <i class="bi bi-chevron-up"></i>
        </button> -->
    </div>
</ng-template>
