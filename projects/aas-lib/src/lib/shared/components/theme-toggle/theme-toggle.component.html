<button
    type="button"
    class="btn btn-link text-decoration-none p-0"
    (click)="toggleTheme()"
    [attr.aria-label]="theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'"
>
    @if (theme() === 'light') {
        <i class="bi bi-moon-stars-fill"></i>
    } @else {
        <i class="bi bi-sun-fill"></i>
    }
</button>
