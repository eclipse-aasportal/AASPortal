<div class="d-flex flex-column border border-1 border-black border-opacity-50 rounded-3 m-2 bg-white">
    <div class="p-2">
        <h3>{{ idShort() }}</h3>
    </div>
    <div class="d-flex flex-column flex-sm-column flex-md-row justify-content-around">
        <div class="m-2 text-center">
            <img
                class="img-thumbnail"
                width="150"
                [src]="thumbnail()"
                alt="thumbnail"
                (error)="thumbnail.set('/assets/resources/aas-idta.png')"
            />
        </div>
        <div class="d-block">
            <label class="text-body-tertiary" translate="DocumentHeader.VERSION"></label>
            <div class="ms-3">{{ version() }}</div>
            <label class="text-body-tertiary" translate="DocumentHeader.AAS_ID"></label>
            <div class="ms-3">{{ id() }}</div>
            <label class="text-body-tertiary" translate="DocumentHeader.ASSET_ID"></label>
            <div class="ms-3">{{ assetId() }}</div>
        </div>
        <div class="d-none d-lg-block">
            <canvas class="qrCode" #qrCode></canvas>
        </div>
    </div>
</div>
