<main class="form-login position-absolute top-50 start-50 translate-middle border border-black border-opacity-25 rounded-2 bg-body-tertiary p-4">
    <form (submit)="submit($event)">
        <h5 class="text-secondary text-start mb-5">
            <i class="bi bi-person-circle"></i>
            <span class="ms-2" translate="LoginForm.CAPTION"></span>
        </h5>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="AID_LOGIN_EMAIL" [formField]="email" />
            <label for="AID_LOGIN_EMAIL" translate="LoginForm.EMAIL"></label>
            <fhg-form-error [field]="email()"></fhg-form-error>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="AID_LOGIN_PASSWORD" [formField]="password" />
            <label for="AID_LOGIN_PASSWORD" translate="LoginForm.PASSWORD"></label>
            <fhg-form-error [field]="password()"></fhg-form-error>
        </div>
        <button
            type="submit"
            class="btn btn-primary text-white w-100 mb-3"
            id="AID_LOGIN_SUBMIT"
            [disabled]="form().invalid()"
            translate="LoginForm.LOGIN"
        ></button>
        <div class="text-start mb-3 fs-sm">
            <span class="me-2 text-secondary" translate="LoginForm.NOT_REGISTERED"></span>
            <a href="/register" translate="LoginForm.CREATE_ACCOUNT"></a>
        </div>
    </form>
</main>
