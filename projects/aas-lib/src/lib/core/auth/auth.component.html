<div ngbDropdown class="d-inline-block">
    <a class="nav-link" tabindex="0" ngbDropdownToggle id="navbarLocalize" role="button">
        <div class="d-inline-flex">
            <div class="px-2"><i class="bi bi-person-circle"></i></div>
            <div>{{ userName() }}</div>
        </div>
    </a>
    <div ngbDropdownMenu aria-labelledby="navbarLocalize" class="dropdown-menu dropdown-menu-end">
        @if (!isAuthenticated()) {
            <a type="button" class="dropdown-item" href="/api/login" tabindex="1" translate="Auth.LOGIN"></a>
            <a type="button" class="dropdown-item" href="/register" tabindex="2" translate="Auth.CREATE_ACCOUNT"></a>
        } @else {
            <a
                type="button"
                class="dropdown-item"
                (click)="logout().subscribe()"
                (keydown.enter)="logout().subscribe()"
                tabindex="3"
                translate="Auth.LOGOUT"
            ></a>
            <a type="button" class="dropdown-item" href="/profile" tabindex="4" translate="Auth.UPDATE_PROFILE"></a>
            <a
                type="button"
                class="dropdown-item"
                (click)="openEndpointAuth().subscribe()"
                tabindex="4"
                translate="Auth.ENDPOINTS"
            ></a>
        }
    </div>
</div>
