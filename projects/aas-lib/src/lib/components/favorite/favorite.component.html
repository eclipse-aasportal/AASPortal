<h5 class="card-header text-truncate">{{ caption() }}</h5>
<div class="card-body">
    <div class="d-flex flex-column">
        <div class="d-flex flex-row mb-2">
            <img [height]="128" [src]="thumbnail()" alt="assets/resources/aas-portal.svg" />
            <div class="d-flex flex-column overflow-hidden ms-2">
                @for (detail of detailItems(); track detail) {
                    <div class="fs-8 text-body-secondary text-nowrap text-truncate">
                        {{ detail.name | translate }}
                    </div>
                    <div class="mb-1 mt-n1 text-truncate text-nowrap">{{ detail.value }}</div>
                }
            </div>
        </div>
        @for (note of noteItems(); track note) {
            <div>{{ note }}</div>
        }
        <div class="mt-2">
            <a [href]="href()" class="card-link">
                <div class="text-truncate" translate>Favorite.SHOW</div>
            </a>
        </div>
    </div>
</div>
