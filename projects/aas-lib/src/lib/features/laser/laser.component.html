<div class="container h-100">
    <div class="d-flex flex-column text-center">
        <div class="bg-primary text-center py-2 my-2 fs-5">{{title()}}</div>
        <div class="d-flex flex-wrap justify-content-around align-items-center mb-2">
            <div class="m-1">
                <img [src]="thumbnail()" alt="thumbnail" [height]="qrCode.height">
            </div>
            <div class="m-1">
                <canvas #qrCode></canvas>
            </div>
        </div>
    </div>
    <div ngbAccordion>
        @for (group of groups(); track group.idShort; let i = $index) {
        <div ngbAccordionItem [collapsed]="i !== 0">
            <h2 ngbAccordionHeader>
                <button class="fw-semibold" ngbAccordionButton>{{group.name}}</button>
            </h2>
            <div ngbAccordionCollapse>
                <div ngbAccordionBody>
                    <ng-template>
                        <table class="table table-sm table-striped table-borderless">
                            <tbody>
                                @for (item of group.items; track item.idShort) {
                                <tr>
                                    <td class="text-nowrap align-middle">{{item.name}}</td>
                                    <td>
                                        @if (item.type === 'link') {
                                        <button class="btn btn-link p-0" type="button" (click)="open($event, item)">{{item.value()}}</button>
                                        } @else {
                                        <div class="text-end">{{item.value()}}</div>
                                        }
                                    </td>
                                    <td class="fhg-w-4">@if (item.isOnline) {
                                        <i class="bi bi-broadcast text-success"></i>
                                        }
                                    </td>
                                </tr>
                                }
                            </tbody>
                        </table>
                    </ng-template>
                </div>
            </div>
        </div>
        }
    </div>
</div>

<ng-template #laserToolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-primary" type="button" (click)="addToStart().subscribe()">
            <i class="bi bi-house-add"></i>
        </button>
    </div>
</ng-template>
