<div class="modal-header">
    <div>
        <h5 class="modal-title">{{ getTitle() }}</h5>
        <h6>{{ body.subtitle }}</h6>
    </div>
    <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
</div>

<div class="modal-body">
    <div class="row">
        <div class="col">
            <div class="d-flex flex-column data-entry">
                <label class="label" translate>HandoverDocumentationPopup.LANGUAGE</label>
                <p>{{body.language}}</p>
            </div>
            <div class="d-flex flex-column data-entry">
                <label class="label" translate>HandoverDocumentationPopup.SUMMARY</label>
                <p>{{body.summary}}</p>
            </div>
            <div class="d-flex flex-column data-entry">
                <label class="label" translate>HandoverDocumentationPopup.KEYWORDS</label>
                <p>{{body.keywords}}</p>
            </div>
        </div>
        <div class="col">
            <img [src]="getPreviewSource(body)"
                 class="popup-img"
                 (error)="body.preview = undefined" />
        </div>
    </div>

    <hr/>

    <div class="d-flex flex-column data-entry">
        <label class="label" translate>HandoverDocumentationPopup.ORGANIZATION</label>
        <p>{{body.organization}}</p>
    </div>
    <div class="d-flex flex-column data-entry">
        <label class="label">Status</label>
        <p>{{body.status}} - {{body.statusDate}}</p>
    </div>
</div>

<div class="modal-footer d-flex flex-row">
    <button type="button" class="btn btn-secondary" (click)="closeModal()" translate>CMD_CLOSE</button>
    <button type="button" class="btn btn-primary" (click)="openFile(); closeModal()">Download</button>
</div>
