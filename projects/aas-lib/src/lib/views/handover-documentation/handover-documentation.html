<div class="container">

    <div class="d-flex flex-wrap align-content-stretch justify-content-around justify-content-sm-start" #flexContainer>
        @for (item of items(); track item.title) {
            <div class="p-3 m-2 bg-body-tertiary border border-black border-opacity-25 rounded text-center flex-item d-flex flex-column justify-content-evenly">
                <label class="label flex-grow-1">{{getDocumentTitle(item)}}</label>
                <img [src]="getPreviewSource(item)"
                    class="img-fluid"
                    (error)="item.preview = undefined" />
                <button type="button" class="btn btn-outline-primary mt-2" (click)="openModal(item)">Details</button>
                <button type="button" class="btn btn-outline-secondary mt-2" (click)="openFile(item)">Download</button>
            </div>
        }
    </div>
</div>
<ng-template #modal>
</ng-template>
