<div class="container h-100">
    <div class="d-flex flex-column text-center">
        <div class="bg-primary text-center py-2 my-2 fs-5" translate>OperationalData.TITLE</div>
        <div class="d-flex flex-row justify-content-end">
            <div class="d-flex flex-column" style="width: fit-content;">
                <label class="text-start" style="font-size: 10px; font-weight: bold;">AAS Overview</label>
                <button [routerLink]="openAASOverview()" type="button" class="btn btn-primary" style="font-size: 1.5rem; width: min-content;"><i class="bi bi-box-arrow-up-right"></i></button>
            </div>
        </div>
        <fhg-thumbnail-qrcode [document]="document()"></fhg-thumbnail-qrcode>
    </div>
    <div ngbAccordion>
        @for (group of groups(); track group.idShort; let i = $index) {
        <div ngbAccordionItem [collapsed]="false">
            <h2 ngbAccordionHeader>
                <button class="fw-semibold" ngbAccordionButton>{{group.name}}</button>
            </h2>
            <div ngbAccordionCollapse>
                <div ngbAccordionBody>
                    <ng-template>
                        <table class="table table-sm table-striped table-borderless">
                            <tbody>
                                @for (item of group.items; track item.idShort) {
                                <tr>
                                    <td class="align-middle">{{item.name}}</td>
                                    <td>
                                        @if (item.type === 'link') {
                                        <a [href]="item.url" target="_blank">{{item.value()}}</a>
                                        } @else {
                                        <div class="text-end">{{item.value()}}</div>
                                        }
                                    </td>
                                    <td class="fhg-w-4">@if (item.isOnline) {
                                        <i class="bi bi-broadcast text-success"></i>
                                        }
                                    </td>
                                </tr>
                                }
                            </tbody>
                        </table>
                    </ng-template>
                </div>
            </div>
        </div>
        }
    </div>
</div>

<ng-template #laserToolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-primary" type="button" (click)="addToStart().subscribe()">
            <i class="bi bi-house-add"></i>
        </button>
    </div>
</ng-template>
