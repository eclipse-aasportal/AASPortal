<h5 class="card-header text-truncate">{{displayName() ?? idShort()}}</h5>
<div class="card-body">
    <div class="row">
        <div class="col col-auto">
            <fhg-img [height]="128" [src]="thumbnail()" alt="assets/resources/aas.svg" />
        </div>
        <div class="col">
            <div class="row row-col-2 card-text text-nowrap">
                <div class="col-5" translate>Favorite.ENDPOINT</div>
                <div class="col-7">{{endpoint()}}</div>
                @if (displayName()) {
                <div class="col-5" translate>Favorite.ID_SHORT</div>
                <div class="col-7">{{idShort()}}</div>
                }
                <div class="col-5" translate>Favorite.VERSION</div>
                <div class="col-7">{{version()}}</div>
                <div class="col-5" translate>Favorite.SUBMODEL_COUNT</div>
                <div class="col-7">{{submodelCount()}}</div>
            </div>
        </div>
    </div>
    @if(description()) {
    <div class="row mt-2">
        <p class="card-text">{{description()}}</p>
    </div>
    }
    <div class="row mt-2">
        <a [href]="href()" class="card-link">
            <div class="text-truncate" translate>Favorite.SHOW</div>
        </a>
    </div>
</div>
