<h2 ngbAccordionHeader>
    <button ngbAccordionButton>
        <span translate>CarbonFootprint.CARBON_FOOTPRINT_DATA</span>
        <span class="ms-2 fs-4 fw-bold">{{totalPcfCO2eq()}}</span>
        <span class="ms-2 fs-6 fw-bold" translate>CarbonFootprint.TOTAL_PSFCO2EQ</span>
    </button>
</h2>
<div ngbAccordionCollapse>
    <div ngbAccordionBody>
        <ng-template>
            <ngb-pagination [collectionSize]="carbonFootprintSize()" [(page)]="carbonFootprintIndex" [pageSize]="1"
                [directionLinks]="carbonFootprintSize() > 5" />
            <table class="table table-sm table-striped table-borderless">
                <caption class="caption-top">{{carbonFootprint().name}}</caption>
                <tbody>
                    @for (item of carbonFootprint().items; track item.name) {
                    <tr>
                        <td class="text-nowrap align-middle">{{item.name}}</td>
                        @if (item.url) {
                        <td>
                            <button class="btn btn-link p-0" type="button"
                                (click)="open($event, item.url)">{{item.value}}</button>
                        </td>
                        } @else {
                        <td>{{item.value}}</td>
                        }
                    </tr>
                    }
                </tbody>
            </table>
        </ng-template>
    </div>
</div>
