@if (loading()) {
    <fhg-loading-spinner></fhg-loading-spinner>
} @else {
<div class="container h-100">
    <div class="d-flex flex-column mt-2">
        <div class="d-flex flex-column flex-sm-row">
            <div class="d-flex flex-column data-entry">
                <h3 translate="DppMetadata.TITLE"></h3>
                @if (dppComplete()) {
                    <span class="text-primary">
                        <i class="bi bi-check2-circle me-1"></i>
                        <span translate="DppMetadata.COMPLETE"></span>
                    </span>
                } @else {
                    <span class="text-danger">
                        <i class="bi bi-x-circle me-1"></i>
                        <span translate="DppMetadata.INCOMPLETE"></span>
                    </span>
                }
            </div>

            <div class="mt-1 mx-4 d-flex flex-row align-items-center ms-sm-auto">
                <button
                    [routerLink]="openAASOverview()"
                    type="button"
                    class="btn btn-outline-primary rounded-5 px-3"
                    style="width: fit-content"
                >
                    <span class="me-2" translate="AAS.OVERVIEW"></span>
                    <i class="bi bi-box-arrow-up-right"></i>
                </button>
            </div>
        </div>
        <fhg-thumbnail-qrcode [document]="document()"></fhg-thumbnail-qrcode>
    </div>

    <div class="mt-3 mx-2  d-flex flex-column flex-md-row justify-content-center">

        <div class="col-md-8 mx-2 p-3 bg-body-tertiary border border-black border-opacity-25 rounded-2">

            <div class="d-flex flex-column flex-md-row">
                <div class="me-2 col-sm d-flex flex-column data-entry border-black border-bottom border-opacity-10">
                    <label class="label" style="overflow-wrap: anywhere; word-break: break-word" translate="DPP ID"></label>
                    <label class="ms-2" style="overflow-wrap: anywhere; word-break: break-word">{{getMetadataValue("digitalProductPassportId")}}</label>
                </div>

                <div class="col-sm d-flex flex-column data-entry border-black border-bottom border-opacity-10">
                    <label class="label" style="overflow-wrap: anywhere; word-break: break-word" translate="Product Identifier"></label>
                    <label class="ms-2" style="overflow-wrap: anywhere; word-break: break-word">{{getMetadataValue("uniqueProductIdentifier")}}</label>
                </div>
            </div>


            <div class="d-flex flex-column flex-md-row">
                <div class="me-2 col-sm d-flex flex-column data-entry border-black border-bottom border-opacity-10">
                    <label class="label" style="overflow-wrap: anywhere; word-break: break-word" translate="Granularity"></label>
                    <label class="ms-2" style="overflow-wrap: anywhere; word-break: break-word">{{getMetadataValue("granularity")}}</label>
                </div>

                <div class="col-sm d-flex flex-column data-entry border-black border-bottom border-opacity-10">
                    <label class="label" style="overflow-wrap: anywhere; word-break: break-word" translate="Economic Operator ID"></label>
                    <label class="ms-2" style="overflow-wrap: anywhere; word-break: break-word">{{getMetadataValue("economicOperatorId")}}</label>
                </div>
            </div>


            <div class="col-sm d-flex flex-column data-entry">
                <label class="label" style="overflow-wrap: anywhere; word-break: break-word" translate="Facility ID"></label>
                <label class="ms-2" style="overflow-wrap: anywhere; word-break: break-word">{{getMetadataValue("facilityId")}}</label>
            </div>

        </div>

        <div class="col-md-4 mx-2 p-3 mt-3 mt-md-0 bg-body-tertiary border border-black border-opacity-25 rounded-2">

            <div class="col-sm d-flex flex-column data-entry border-black border-bottom border-opacity-10">
                <label class="label" style="overflow-wrap: anywhere; word-break: break-word" translate="Schema Version"></label>
                <label class="ms-2" style="overflow-wrap: anywhere; word-break: break-word">{{getMetadataValue("dppSchemaVersion")}}</label>
            </div>

            <div class="col-sm d-flex flex-column data-entry border-black border-bottom border-opacity-10">
                <label class="label" style="overflow-wrap: anywhere; word-break: break-word" translate="Status"></label>
                <label class="ms-2" style="overflow-wrap: anywhere; word-break: break-word">{{getMetadataValue("dppStatus")}}</label>
            </div>

            <div class="col-sm d-flex flex-column data-entry">
                <label class="label" style="overflow-wrap: anywhere; word-break: break-word" translate="Last Updated"></label>
                <label class="ms-2" style="overflow-wrap: anywhere; word-break: break-word">{{getMetadataValue("lastUpdate")}}</label>
            </div>

        </div>

    </div>

    @for (item of contentSubmodels(); track item.submodel.id) {
        <div class="mt-4">
            <h4 class="border-bottom pb-1 mb-2">{{ item.submodel.idShort }}</h4>
            @if (item.view; as view) {
                <ng-container
                    *ngComponentOutlet="view.component; inputs: view.inputs(item.submodel)"
                ></ng-container>
            } @else {
                <fhg-submodel-tree [submodel]="item.submodel" [document]="document()"></fhg-submodel-tree>
            }
        </div>
    }
</div>
}

<ng-template #toolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-primary" type="button" (click)="addToStart().subscribe()">
            <i class="bi bi-house-add"></i>
        </button>
    </div>
</ng-template>
