<div class="container h-100">
    <div class="d-flex flex-column mt-2 mb-3">
        <div class="d-flex flex-column flex-sm-row">
            <div class="d-flex flex-column data-entry">
                <h3 translate="ContactInformation.TITLE"></h3>
            </div>

            <div class="mt-1 mx-4 d-flex flex-row ms-sm-auto">
                <button
                    [routerLink]="openAASOverview()"
                    type="button"
                    class="btn btn-outline-primary rounded-5 px-3"
                    style="width: fit-content"
                >
                    <span class="me-2" translate="AAS.OVERVIEW"></span>
                    <i class="bi bi-box-arrow-up-right"></i>
                </button>
            </div>
        </div>
        <fhg-thumbnail-qrcode [document]="document()"></fhg-thumbnail-qrcode>
    </div>
    <fhg-contact-information
        [document]="document()"
        [state]="contactInformationState"
    ></fhg-contact-information>
</div>

<ng-template #toolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-outline-primary" type="button" (click)="addToStart().subscribe()">
            Add to Start
            <i class="bi bi-house-add"></i>
        </button>
    </div>
    @if (count() >= 2) {
        <div class="input-group my-1">
            <ngb-pagination
                [collectionSize]="count()"
                [(page)]="index"
                [pageSize]="1"
                [directionLinks]="count() > 5"
                [ellipses]="true"
            />
        </div>
    }
</ng-template>
