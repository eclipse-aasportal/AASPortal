<div ngbAccordion>
    @for (contact of contacts(); track contact; let i = $index) {
    <div ngbAccordionItem [collapsed]="contact.collapsed">
        <h2 ngbAccordionHeader>
            <button ngbAccordionButton>{{contact.name}}</button>
        </h2>
        <div ngbAccordionCollapse>
            <div ngbAccordionBody>
                <ng-template>
                    <dl class="row">
                        @for (item of contact.items; track item) {
                        <dt class="col-sm-3">{{item.displayName}}</dt>
                        <dd class="col-sm-9">{{item.value}}</dd>
                        }
                    </dl>
                </ng-template>
            </div>
        </div>
    </div>
    }
</div>
