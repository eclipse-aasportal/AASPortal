<div class="container h-100">
    <div class="d-flex flex-column text-center">
        <div class="bg-primary text-center py-2 my-2 fs-5" translate>ServiceRequestNotification.TITLE</div>
        <div class="d-flex flex-row justify-content-end">
            <div class="d-flex flex-column" style="width: fit-content">
                <label class="text-start" style="font-size: 10px; font-weight: bold">AAS Overview</label>
                <button
                    [routerLink]="openAASOverview()"
                    type="button"
                    class="btn btn-primary"
                    style="font-size: 1.5rem; width: min-content"
                >
                    <i class="bi bi-box-arrow-up-right"></i>
                </button>
            </div>
        </div>
        <fhg-thumbnail-qrcode [document]="document()"></fhg-thumbnail-qrcode>
    </div>
    @for (item of items(); track item.idShort; let i = $index) {
        <div>{{ item.idShort }}</div>
    }
</div>

<ng-template #toolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-primary" type="button" (click)="addToStart().subscribe()">
            <i class="bi bi-house-add"></i>
        </button>
    </div>
</ng-template>
