@if (submodels()) {
    <div class="container h-100">

        <div class="d-flex flex-column mt-2">
            <div class="d-flex flex-row">
                <div class="d-flex flex-column data-entry">
                    <h3 translate="DigitalProductPassport.CAPTION"></h3>
                </div>

                <div class="mt-1 mx-4 d-flex flex-row ms-auto">
                    <button
                        [routerLink]="openAASOverview()"
                        type="button"
                        class="btn btn-outline-primary rounded-5 px-3"
                        style="width: fit-content"
                    >
                        <span class="me-2" translate="AAS.OVERVIEW"></span>
                        <i class="bi bi-box-arrow-up-right"></i>
                    </button>
                </div>
            </div>
            <fhg-thumbnail-qrcode [document]="document()"></fhg-thumbnail-qrcode>
            @if (hazardStatement()) {
                <div class="text-center fs-3 fw-bold mb-2">{{ hazardStatement() }}</div>
                <div class="d-flex flex-row justify-content-center">
                    <img class="img-fluid" [src]="hazardSymbol()" alt="DPP hazard symbol" width="96" />
                </div>
            }
        </div>
        
        <hr/>
        <label class="label">Nameplate</label>
        <div class="mt-3">
            <fhg-nameplate [document]="document()" [state]="nameplateState"></fhg-nameplate>
        </div>
        <hr/>
         <label class="label">Carbon Footprint</label>
        <div class="mt-3">
            <fhg-carbon-footprint [isDigitalProductPassport]="true" [document]="document()" [state]="carbonFootprintState"></fhg-carbon-footprint>
        </div>
        <hr/>
         <label class="label">Documents</label>
        <div class="mt-3">
            <fhg-handover-documentation
                [document]="document()"
                [state]="handoverDocumentationState"
                [collapsed]="true"
            ></fhg-handover-documentation>
        </div>
    </div>
} @else {
    <div class="alert alert-info text-center mt-2" role="alert">{{ 'DigitalProductPassport.EMPTY' | translate }}</div>
}

<ng-template #dppToolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-primary" type="button" (click)="addToStart().subscribe()">
            <i class="bi bi-house-add"></i>
        </button>
    </div>
</ng-template>
