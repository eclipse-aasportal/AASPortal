<div class="mt-2 p-4 d-flex flex-row align-items-center justify-content-around bg-body-tertiary border border-black border-opacity-25 rounded-2">
    <!-- Header of the header -->
    <div class="ms-4 flex-sm-fill d-flex flex-row flex-wrap align-items-center justify-content-start">
        <div class="border border-1 border-black border-opacity-50 rounded-2">
            <img
                class="img-fluid thumbnail-img"
                [src]="thumbnail()"
                alt="thumbnail"
                (error)="thumbnail.set('/assets/resources/aas-idta.png')"
            />
        </div>
        <div class="d-flex flex-column ps-1 d-none d-sm-block text-start" style="max-width: 55%;">
            <div class="p-1 d-flex flex-column mt-0">
                <label class="label">IdShort</label>
                <label class="ms-2" style="overflow-wrap: anywhere; word-break: break-all">{{ idShort() }}</label>
            </div>
            <div class="p-1 d-flex flex-column mt-0">
                <label class="label" translate="AAS.AAS_ID"></label>
                <label class="ms-2" style="overflow-wrap: anywhere; word-break: break-all">{{ id() }}</label>
            </div>
            <div class="p-1 d-flex flex-column mt-0">
                <label class="label" translate="AAS.ASSET_ID"></label>
                <label class="ms-2" style="overflow-wrap: anywhere; word-break: break-all">{{ assetId() }}</label>
            </div>
        </div>
    </div>

    <div class="d-flex flex-sm-column flex-row align-items-end align-self-start mb-sm-0 mb-4">
        <div class="d-none d-lg-block ms-auto">
            <canvas class="qrCode border border-black border-opacity-50 border rounded-2" #qrCode></canvas>
        </div>
    </div>
</div>
