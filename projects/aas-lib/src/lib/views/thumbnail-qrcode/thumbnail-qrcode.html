<div class="container mb-2">
    <div class="d-flex flex-row flex-wrap justify-content-around">
        <div class="">
            <img
                class="border border-primary border-2"
                [src]="thumbnail()"
                alt="thumbnail"
                [height]="qrCode.height"
                (error)="thumbnail.set('/assets/resources/aas-idta.png')"
            />
        </div>
        <div class="">
            <canvas class="border border-primary border-2" #qrCode></canvas>
        </div>
    </div>
</div>
