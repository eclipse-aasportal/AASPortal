<div class="container h-100">
    <div class="d-flex flex-column text-center text-body">
        <div class="bg-primary text-center py-2 my-2 fs-5">
            <div class="d-flex flex-column data-entry">
                <label class="label">{{getSemanticId()}}</label>
                <div>
                    <span translate="Nameplate.TITLE"></span>
                    <span class="ms-1">{{ version() }}</span>
                </div>
                
            </div>
        </div>
        <div class="d-flex flex-row justify-content-end">
            <div class="d-flex flex-column" style="width: fit-content;">
                <label class="text-start" style="font-size: 10px; font-weight: bold;">AAS Overview</label>
                <button [routerLink]="openAASOverview()" type="button" class="btn btn-primary" style="font-size: 1.5rem; width: min-content;"><i class="bi bi-box-arrow-up-right"></i></button>
            </div>
        </div>
        <fhg-thumbnail-qrcode [document]="document()"></fhg-thumbnail-qrcode>
    </div>
    <fhg-nameplate [document]="document()" [state]="nameplateState"></fhg-nameplate>
</div>

<ng-template #nameplateToolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-primary" type="button" (click)="addToStart().subscribe()">
            <i class="bi bi-house-add"></i>
        </button>
    </div>
    @if (count() >= 2) {
        <div class="input-group my-1">
            <ngb-pagination
                [collectionSize]="count()"
                [(page)]="index"
                [pageSize]="1"
                [directionLinks]="count() > 5"
                [ellipses]="true"
            />
        </div>
    }
</ng-template>
