<div class="container mt-4">
    <div class="container">
        <div class="row">
            <div class="col-md-6 p-1 d-flex flex-column mt-0">
                <label class="label">AssetID</label>
                <label>{{getAssetId()}}</label>
            </div>
            <div class="col-md-6 p-1 d-flex flex-column mt-0">
                <label class="label">AAS</label>
                <label>{{getAASIdShort()}}</label>
            </div>
        </div>
    </div>

    <div class="row">
      <div class="col-md-6 bg-primary-subtle text-black p-3 bg-opacity-75">
        <div class="d-flex flex-row">
            <div>
                <div class="d-flex flex-column data-entry">
                    <label class="label">Name</label>
                    <label>{{getNameplateValue("ManufacturerProductDesignation")}}</label>
                </div>
                <div class="d-flex flex-column data-entry">
                    <label class="label">Serialnumber</label>
                    <label>{{getNameplateValue("SerialNumber")}}</label>
                </div>
                <div class="d-flex flex-column data-entry">
                    <label class="label">URI</label>
                    <label>{{getNameplateValue("URIOfTheProduct")}}</label>
                </div>
                <div class="d-flex flex-column data-entry">
                    <label class="label">Year of Construction</label>
                    <label>{{getNameplateValue("YearOfConstruction")}}</label>
                </div>
                <div class="d-flex flex-column data-entry">
                    <label class="label">Date of Manufacture</label>
                    <label>{{getNameplateValue("DateOfManufacture")}}</label>
                </div>
            </div>
            <div class="ms-5">
                <div class="d-flex flex-column data-entry">
                    <label class="label">Product Type</label>
                    <label>{{getNameplateValue("ManufacturerProductType")}}</label>
                </div>
                <div class="d-flex flex-column data-entry">
                    <label class="label">Product Family</label>
                    <label>{{getNameplateValue("ManufacturerProductFamily")}}</label>
                </div>
            </div>
        </div>
      </div>
      
      <div class="col-md-6 bg-white bg-opacity-50 text-black p-3 ">
        <div class="image-container border border-2 border-dark p-2 bg-white">
            <img src="{{getCompanyLogo()}}">
        </div>
        <div class="d-flex flex-column data-entry">
            <label class="label">Manufacturer</label>
            <label>{{getNameplateValue("ManufacturerName")}}</label>
        </div>  
        <div class="d-flex flex-column data-entry">
            <label class="label">Manufacturer Address</label>
            <label>{{getNameplateValue(["AddressInformation", "PhysicalAddress"])}}</label>
        </div>  
      </div>
    </div>
  </div>
