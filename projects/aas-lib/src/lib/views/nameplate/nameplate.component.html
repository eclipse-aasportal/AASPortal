<div class="container h-100">
    <div class="d-flex flex-column text-center">
        <div class="bg-primary text-center py-2 my-2 fs-5">{{title()}}</div>
        <fhg-thumbnail-qrcode [document]="document()"></fhg-thumbnail-qrcode>
    </div>
    <div ngbAccordion>
        @for (group of nameplateGroups(); track group.idShort; let i = $index) {
        <div ngbAccordionItem [collapsed]="i !== 0">
            <h2 ngbAccordionHeader>
                <button ngbAccordionButton>{{group.name}}</button>
            </h2>
            <div ngbAccordionCollapse>
                <div ngbAccordionBody>
                    <ng-template>
                        <table class="table table-sm table-striped table-borderless">
                            <tbody>
                                @for (item of group.items; track item.idShort) {
                                <tr>
                                    <td class="text-nowrap align-middle">{{item.name | translate}}</td>
                                    @if (item.type === 'link') {
                                    <td>
                                        <button class="btn btn-link p-0" type="button" (click)="open($event, item)">{{item.value}}</button>
                                    </td>
                                    } @else {
                                    <td>{{item.value}}</td>
                                    }
                                </tr>
                                }
                            </tbody>
                        </table>
                    </ng-template>
                </div>
            </div>
        </div>
        }
    </div>
</div>

<ng-template #nameplateToolbar>
    <div class="input-group me-2 my-1">
        <button class="btn btn-primary" type="button" (click)="addToStart().subscribe()">
            <i class="bi bi-house-add"></i>
        </button>
    </div>
    @if (nameplateSize() >= 2) {
    <div class="input-group my-1">
        <ngb-pagination [collectionSize]="nameplateSize()" [(page)]="nameplateIndex" [pageSize]="1"
            [directionLinks]="nameplateSize() > 5" [ellipses]="true" />
    </div>
    }
</ng-template>
