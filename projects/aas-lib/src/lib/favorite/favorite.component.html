<h5 class="card-header text-truncate">{{caption()}}</h5>
<div class="card-body">
    <div class="d-flex flex-column">
        <div class="d-flex flex-row mb-2">
            <fhg-img [height]="128" [src]="thumbnail()" alt="assets/resources/aas.svg" />
            <div class="d-flex flex-column mx-2 fw-medium text-nowrap overflow-hidden">
                @for (detail of detailItems(); track detail) {
                <div class="text-truncate">{{detail.name | translate}}</div>
                }
            </div>
            <div class="d-flex flex-column overflow-hidden text-nowrap">
                @for (detail of detailItems(); track detail) {
                <div class="text-truncate">{{detail.value}}</div>
                }
            </div>
        </div>
        @for (note of noteItems(); track note) {
        <div>{{note}}</div>
        }
        <div class="mt-2">
            <a [href]="href()" class="card-link">
                <div class="text-truncate" translate>Favorite.SHOW</div>
            </a>
        </div>
    </div>
</div>
