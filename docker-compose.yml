services:
  aasportal-users:
    image: mongo
    container_name: aasportal-users
    restart: always
    volumes:
      - aasportal-users:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=aasportal-users
    ports:
      - 27017:27017

  aasportal-index:
    image: mariadb
    container_name: aasportal-index
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      interval: 30s
      retries: 3
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized"
        ]
      timeout: 30s
    volumes:
      - ./projects/aasportal-index/schema.sql:/docker-entrypoint-initdb.d/1.sql
      - aasportal-index:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: aas-index
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - 3306:3306

  aas-server:
    container_name: aas-server
    build:
      context: .
      dockerfile: ./Dockerfile.aas-server
      args:
        - NODE_IMAGE=${NODE_IMAGE}
    volumes:
      - aas-server:/data
    environment:
      - AAS_SERVER_PORT=${AAS_SERVER_PORT}
      - ENABLE_STATIC_FILES=${ENABLE_STATIC_FILES}
    ports:
      - 50015:50010

  aas-node:
    container_name: aas-node
    build:
      context: .
      dockerfile: ./Dockerfile.aas-node
      args:
        - NODE_IMAGE=${NODE_IMAGE}
    depends_on:
      aasportal-index:
        condition: service_healthy
      aasportal-users:
        condition: service_started
    environment:
      - AAS_INDEX=${AAS_INDEX}
      - IDENTITY_PROVIDER=${IDENTITY_PROVIDER}
      - COOKIE_STORE=${COOKIE_STORE}
      - SESSION_STORE=${SESSION_STORE}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - HOST_URL=${HOST_URL}
    ports:
      - 1337:1337
  
  aas-portal:
    container_name: aas-portal
    build:
      context: .
      dockerfile: ./Dockerfile.aas-portal
      args:
        - NODE_IMAGE=${NODE_IMAGE}
        - NGINX_IMAGE=${NGINX_IMAGE}
    depends_on:
      aas-node:
        condition: service_started
    restart: always
    environment:
      - BASE_HREF=${BASE_HREF:-/}
      - THEME_PRIMARY_COLOR=${THEME_PRIMARY_COLOR:-}
      - THEME_SECONDARY_COLOR=${THEME_SECONDARY_COLOR:-}
      - COMPANY_URL=${COMPANY_URL:-}
    # To white-label the header logos, mount replacements over the built-in ones -- no rebuild needed.
    # company-logo.svg (top-left, links to COMPANY_URL above) and aas-portal.svg (top-right) are both
    # plain static files:
    # volumes:
    #   - ./my-company-logo.svg:/usr/share/nginx/html/assets/company-logo.svg:ro
    #   - ./my-logo.svg:/usr/share/nginx/html/assets/aas-portal.svg:ro
    ports:
      - 80:80

volumes:
  aasportal-users:
  aasportal-index:
  aas-server:
