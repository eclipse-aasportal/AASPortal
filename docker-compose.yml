services:
  aasportal-users:
    image: mongo
    container_name: aasportal-users
    restart: always
    volumes:
      - aasportal-users:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=aasportal-users
    ports:
      - 27017:27017

  aasportal-index:
    image: mariadb
    container_name: aasportal-index
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      interval: 30s
      retries: 3
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized"
        ]
      timeout: 30s
    volumes:
      - ./projects/aasportal-index/schema.sql:/docker-entrypoint-initdb.d/1.sql
      - aasportal-index:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: aas-index
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - 3306:3306

  aasportal-cloud-db:
    image: mariadb
    container_name: aasportal-cloud-db
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - nextcloud_db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${NEXTCLOUD_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  aasportal-cloud:
    image: nextcloud
    container_name: aasportal-cloud
    restart: always
    depends_on:
      - aasportal-cloud-db
    volumes:
      - aasportal-cloud:/var/www/html
    environment:
      - MYSQL_PASSWORD=${NEXTCLOUD_MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=aasportal-cloud-db
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
    ports:
      - 8080:80

  aas-server:
    container_name: aas-server
    build:
      context: .
      dockerfile: ./Dockerfile.aas-server
      args:
        - NODE_IMAGE=${NODE_IMAGE}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:50010/api/v3/shells"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - aas-server:/data
    environment:
      - AAS_SERVER_PORT=${AAS_SERVER_PORT}
      - ENABLE_STATIC_FILES=${ENABLE_STATIC_FILES}
    ports:
      - 50010:50010

  aas-node:
    container_name: aas-node
    build:
      context: .
      dockerfile: ./Dockerfile.aas-node
      args:
        - NODE_IMAGE=${NODE_IMAGE}
    depends_on:
      aas-server:
        condition: service_healthy
      aasportal-index:
        condition: service_healthy
      aasportal-users:
        condition: service_started
    environment:
      - AAS_NODE_PORT=${AAS_NODE_PORT}
      - USER_STORAGE=${USER_STORAGE}
      - AAS_INDEX=${AAS_INDEX}
      - TEMPLATE_STORAGE=${TEMPLATE_STORAGE}
      - ENDPOINTS=${ENDPOINTS}
    ports:
      - 1337:1337
  
  aas-portal:
    container_name: aas-portal
    build:
      context: .
      dockerfile: ./Dockerfile.aas-portal
      args:
        - NODE_IMAGE=${NODE_IMAGE}
        - NGINX_IMAGE=${NGINX_IMAGE}
    restart: always
    ports:
      - 80:80

volumes:
  aasportal-users:
  aasportal-index:
  nextcloud_db:
  aasportal-cloud:
  aas-server:
